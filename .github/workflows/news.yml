name: עדכון חדשות NBA

on:
  schedule:
    - cron: "17 */3 * * *"   # כל 3 שעות
  workflow_dispatch:          # כפתור הרצה ידנית

permissions:
  contents: write

concurrency: news

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: איסוף חדשות
        run: python fetch_news.py

      - name: שמירה באתר
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "nba-arena-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "עדכון חדשות אוטומטי"
            git push
          else
            echo "אין שינוי"
          fi
