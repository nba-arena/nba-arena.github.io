<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA ארנה | חידונים ומשחקי כדורסל</title>
<meta name="description" content="אתר חידונים ומשחקים בנושא ה-NBA בעברית: חידון ענק, זיכרון, נחש את הסמל, אתגר קליעה, בנה חמישייה ועוד.">
<style>
:root{--bg:#0a0f1f;--card:#141b34;--card2:#1b2447;--line:#2a3566;--ac:#ff7a1a;--ac2:#ffb347;--good:#2ecc71;--bad:#ff4d5e;--txt:#eef1ff;--mut:#9aa6d6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#26325f 0,transparent 60%),var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:rgba(10,15,31,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.logo{font-size:1.5rem;font-weight:800;cursor:pointer;letter-spacing:.5px}
.logo b{color:var(--ac)}
.lv{cursor:pointer;min-width:150px}
.lvTop{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin-bottom:4px;gap:10px}
.xpBar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.xpBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
main{max-width:920px;margin:0 auto;padding:18px}
.view{display:none}.view.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h2{margin:0;font-size:1.6rem}
.back{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.center{text-align:center}
.lead{font-size:1.1rem;margin-top:0}
.muted{color:var(--mut);font-size:.9rem}
.big{font-size:4rem}
.row,.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.btn{background:linear-gradient(#ff8a2b,#ff6a00);border:0;color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;cursor:pointer;font-size:1rem;box-shadow:0 4px 0 #b84a00;transition:.1s;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b84a00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card2);box-shadow:0 4px 0 #0c1230;border:1px solid var(--line)}
.btn.good{background:linear-gradient(#34d97b,#1fae5c);box-shadow:0 4px 0 #137a3f}
.btn.bad{background:linear-gradient(#ff6070,#e5303f);box-shadow:0 4px 0 #9c1c27}
.btn.small{padding:7px 14px;font-size:.85rem;margin-top:10px}
.stats{display:flex;justify-content:space-between;gap:10px;color:var(--mut);margin-bottom:10px;font-weight:600}
.q{font-size:1.35rem;margin:14px 0}
.tbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--ac2),var(--bad));background-size:300% 100%;transition:width .1s linear}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card2);border:2px solid var(--line);color:var(--txt);padding:14px;border-radius:12px;font-size:1rem;cursor:pointer;font-family:inherit;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateY(-2px)}
.opt.correct{background:var(--good);border-color:var(--good);color:#04210f}
.opt.wrong{background:var(--bad);border-color:var(--bad);animation:shake .3s}
.opt.gone{opacity:.2}
.fb{min-height:28px;font-weight:700;margin-top:12px;font-size:1.1rem}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:.2s;text-align:center}
.gc:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 12px 30px rgba(255,122,26,.18)}
.gc .ic{font-size:2.6rem}
.gc h3{margin:6px 0 4px}
.gc p{margin:0;color:var(--mut);font-size:.88rem}
.hero{background:linear-gradient(135deg,#ff7a1a22,#3a4ea822);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:16px;text-align:center}
.hero h1{margin:0 0 6px;font-size:2.2rem}
.hero p{margin:0;color:var(--mut)}
.fact{display:flex;gap:12px;align-items:center;justify-content:space-between}
.fact p{margin:0;font-size:1.05rem}
.clues{list-style:none;padding:0;margin:10px 0}
.clues li{background:var(--card2);border-radius:10px;padding:10px 14px;margin-bottom:8px;animation:pop .3s;border-right:4px solid var(--ac)}
.hol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:22px 10px;text-align:center}
.hc h3{margin:0 0 8px}
.hc .v{font-size:2rem;font-weight:800;color:var(--ac2)}
.hc.ok{border-color:var(--good)}.hc.no{border-color:var(--bad);animation:shake .3s}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1;background:var(--card2);border:2px solid var(--line);border-radius:14px;font-size:1.8rem;cursor:pointer;color:var(--txt);font-family:inherit;font-weight:700;padding:4px;transition:.15s}
.mc.open{background:var(--ac);border-color:var(--ac2);font-size:1rem}
.mc.done{background:var(--good);border-color:var(--good);color:#04210f;font-size:1rem}
.evs{display:grid;gap:10px}
.ev{display:flex;align-items:center;gap:12px;background:var(--card2);border:2px solid var(--line);color:var(--txt);padding:14px;border-radius:12px;font-size:1rem;cursor:pointer;text-align:right;font-family:inherit}
.ev .n{min-width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--ac2)}
.ev.ok{border-color:var(--good)}.ev.no{border-color:var(--bad)}
.ev .yr{margin-right:auto;font-weight:800;color:var(--ac2)}
.word{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0;font-size:2rem;font-weight:800}
.word span{width:38px;border-bottom:4px solid var(--ac);text-align:center;min-height:50px}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr}
.kb button{width:40px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:700;cursor:pointer}
.kb button.hit{background:var(--good);color:#04210f}.kb button.miss{background:var(--bad);opacity:.6}
.kb button:disabled{cursor:default}
canvas{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);display:block;cursor:pointer}
.bar{position:relative;height:30px;background:#2a1010;border-radius:99px;overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.bar .z1{position:absolute;top:0;bottom:0;background:#c9a227}
.bar .z2{position:absolute;top:0;bottom:0;background:var(--good)}
.bar #mk{position:absolute;top:-2px;bottom:-2px;width:8px;margin-right:-4px;background:#fff;border-radius:4px;box-shadow:0 0 8px #fff;left:0}
.msg{height:30px;text-align:center;font-weight:800;font-size:1.2rem;color:var(--ac2)}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pc{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;color:var(--txt);font-family:inherit;font-size:1rem}
.pc:hover{border-color:var(--ac);transform:translateY(-3px)}
.pc b{display:block;margin-bottom:6px}
.rt{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:2px 12px;font-weight:800}
table{width:100%;border-collapse:collapse;text-align:center}
td,th{padding:8px;border-bottom:1px solid var(--line)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ac{background:var(--card2);border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line)}
.ac.lock{opacity:.35;filter:grayscale(1)}
.ac .i{font-size:2rem}
.ac small{color:var(--mut)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center}
.toast{background:#000d;border:1px solid var(--ac);padding:10px 18px;border-radius:99px;font-weight:700;animation:pop .3s}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:24px 14px}
.hl{display:flex;align-items:center;gap:12px}
.menuBtn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:1rem;font-family:inherit;font-weight:700}
.menuBtn:hover{border-color:var(--ac)}
.menu{position:absolute;top:100%;right:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:230px;padding:8px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:30}
.menu.open{display:block;animation:pop .2s}
.menu button{display:block;width:100%;text-align:right;background:none;border:0;color:var(--txt);padding:12px 14px;border-radius:10px;cursor:pointer;font-size:1rem;font-family:inherit}
.menu button:hover{background:var(--card2)}
.in{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:1rem}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl input{flex:1;min-width:160px}
.tw{overflow-x:auto}
table.st{min-width:680px}
.st th{cursor:pointer;white-space:nowrap;color:var(--ac2);position:sticky;top:0;background:var(--card)}
.st td:first-child,.st th:first-child{text-align:right}
.st tr:hover td{background:rgba(255,255,255,.04)}
.tag{background:var(--ac);color:#fff;border-radius:99px;padding:1px 8px;font-size:.7rem;margin-right:6px;white-space:nowrap}
.cmpb{background:var(--card2);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:4px 8px;color:var(--txt)}
.cmpb.on{background:var(--ac);border-color:var(--ac2)}
.cr{display:grid;grid-template-columns:1fr 100px 1fr;gap:10px;align-items:center;margin:10px 0}
.cr b{text-align:center;color:var(--mut);font-size:.85rem}
.cv{font-weight:800;margin-bottom:3px}
.cv.win{color:var(--good)}
.cb{background:var(--card2);height:14px;border-radius:99px;overflow:hidden}
.cb i{display:block;height:100%;background:var(--ac)}
.cb.b i{background:#4da3ff}
.cnames{display:grid;grid-template-columns:1fr 100px 1fr;gap:10px;text-align:center;font-weight:800;font-size:1.1rem}
/* --- נחש את הקבוצה/השחקן --- */
.gz{position:relative;width:260px;height:260px;margin:4px auto 14px;border-radius:18px;overflow:hidden;background:#fff;border:2px solid var(--line)}
.gz .im{position:absolute;inset:0;display:grid;place-items:center;padding:14px}
.gz .im img{max-width:100%;max-height:100%;display:block}
.gz.ph .im{padding:0}
.gz.ph .im img{width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
.gzMask{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr)}
.gzMask i{background:#141b34;outline:1px solid #0a0f1f;transition:opacity .35s,transform .35s}
.gzMask i.off{opacity:0;transform:scale(.4);pointer-events:none}
.gzKind{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 14px;font-size:.85rem;color:var(--ac2);font-weight:700}
@media(max-width:560px){.opts,.hol{grid-template-columns:1fr}.hero h1{font-size:1.7rem}.mem{gap:6px}.lv{min-width:110px}.logo{font-size:1.2rem}.menuBtn{padding:7px 10px}.cr,.cnames{grid-template-columns:1fr 64px 1fr}.gz{width:220px;height:220px}}
.news{display:grid;gap:14px}
.nw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.nw img{width:110px;height:74px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--card2)}
.nw h3{margin:0 0 6px;font-size:1.08rem;line-height:1.4}
.nw p{margin:0 0 10px;color:var(--mut);line-height:1.6}
.nwMeta{font-size:.85rem;color:var(--mut);margin-bottom:8px}
.nwGo{color:var(--ac2);font-weight:700;text-decoration:none}
.nwGo:hover{text-decoration:underline}
@media(max-width:560px){.nw{flex-direction:column}.nw img{width:100%;height:160px}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hl">
    <button class="menuBtn" onclick="toggleMenu(event)" aria-label="תפריט">☰ תפריט</button>
    <div class="logo" onclick="go('home')">🏀 NBA <b>ארנה</b></div>
  </div>
  <div class="lv" onclick="go('profile')" title="הפרופיל שלי">
    <div class="lvTop"><span id="lvl"></span><span id="xpTxt"></span></div>
    <div class="xpBar"><i id="xpFill"></i></div>
  </div>
  <nav class="menu" id="menu">
    <button onclick="go('home')">🏠 בית</button>
    <button onclick="go('news')">📰 חדשות NBA</button>
    <button onclick="go('stats')">📊 טבלאות סטטיסטיקה</button>
    <button onclick="go('profile')">🏅 הפרופיל שלי</button>
    <button onclick="go('about')">ℹ️ אודות</button>
  </nav>
</header>
<main id="app"></main>
<div id="toasts"></div>
<footer>אתר מעריצים לא רשמי, ללא קשר ל-NBA או לקבוצות. הסמלים והתמונות הם רכושם של בעליהם ומוצגים כאן לצורך שעשוע ולמידה בלבד. הדירוגים והנתונים עשויים להיות לא מדויקים לגמרי.</footer>

<script>
"use strict";
/* ============ כלים כלליים ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>Math.random()*(b-a)+a;
const ri=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);

/* ============ שמירה והישגים ============ */
const KEY="nba_arena_v1";
let save={xp:0,best:{},ach:{},plays:0};
try{const s=localStorage.getItem(KEY);if(s){save={...save,...JSON.parse(s)};}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}};
const TITLES=["טירון","שחקן ספסל","שחקן רוטציה","פותח בחמישייה","אול-סטאר","MVP","אגדה","היכל התהילה"];
const lvl=()=>Math.floor(save.xp/150)+1;
const ACH=[
 {id:"first",i:"🏀",n:"צעד ראשון",d:"סיימו משחק אחד"},
 {id:"plays10",i:"🎮",n:"מכורים",d:"שחקו 10 משחקים"},
 {id:"trivia_perfect",i:"🧠",n:"גאון NBA",d:"10 מתוך 10 בחידון"},
 {id:"trivia_streak",i:"🔥",n:"רצף לוהט",d:"8 נכונות ברצף בחידון"},
 {id:"tf15",i:"⚡",n:"מהיר כברק",d:"15 נכון/לא נכון בסיבוב"},
 {id:"who_ace",i:"🕵️",n:"בלש",d:"נחשו שחקן ברמז הראשון"},
 {id:"eagle",i:"🔍",n:"עין נשר",d:"זיהו סמל בלי לחשוף אף ריבוע"},
 {id:"logo8",i:"🧿",n:"מזהה סמלים",d:"8 זיהויים נכונים ברצף"},
 {id:"hol10",i:"📈",n:"עין חדה",d:"רצף 10 בגבוה/נמוך"},
 {id:"mem14",i:"🧩",n:"זיכרון פיל",d:"זיכרון ב-14 מהלכים או פחות"},
 {id:"swish",i:"🎯",n:"שווש מושלם",d:"10 מתוך 10 מהעונשין"},
 {id:"deep",i:"🚀",n:"מעבר לקשת",d:"18 נקודות ומעלה במשחק הקשת"},
 {id:"time16",i:"⏳",n:"מכונת זמן",d:"16 נקודות בציר הזמן"},
 {id:"hang5",i:"🔤",n:"מלך המילים",d:"5 מילים ברצף בתלייה"},
 {id:"draft_win",i:"👑",n:"מאמן השנה",d:"נצחו בבנה חמישייה"},
 {id:"lvl5",i:"⭐",n:"אול-סטאר",d:"הגיעו לדרגה 5"}
];
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),2600);}
function renderHeader(){const l=lvl();$("#lvl").textContent="דרגה "+l+" · "+TITLES[Math.min(TITLES.length-1,l-1)];$("#xpTxt").textContent=save.xp+" XP";$("#xpFill").style.width=((save.xp%150)/150*100)+"%";}
function unlock(id){if(save.ach[id])return;save.ach[id]=1;persist();const a=ACH.find(x=>x.id===id);toast("🏆 הישג חדש: "+a.n);}
function addXP(n){if(n<=0)return;save.xp+=n;persist();renderHeader();toast("+"+n+" XP");if(lvl()>=5)unlock("lvl5");}
function setBest(k,v,low){const o=save.best[k];if(o===undefined||(low?v<o:v>o)){save.best[k]=v;persist();return true;}return false;}
function finish(xp){save.plays++;unlock("first");if(save.plays>=10)unlock("plays10");persist();addXP(xp);}
function resultHTML(e,t,lines,btns){return `<div class="card center pop"><div class="big">${e}</div><h3>${t}</h3>${lines.map(l=>`<p>${l}</p>`).join("")}<div class="row">${btns}</div></div>`;}

/* ============ מאגרי נתונים ============ */
/* חידון: [קטגוריה, שאלה, [תשובות], אינדקס נכון] */
const TRIVIA=[
["hist","באיזו שנה נוסדה ליגת ה-BAA שהתמזגה והפכה ל-NBA?",["1946","1925","1960","1972"],0],
["hist","איזו קבוצה קנדית זכתה באליפות ה-NBA ב-2019?",["ונקובר גריזליז","טורונטו ראפטורס","מונטריאול","אוטווה"],1],
["hist","באיזו עיר זכתה ה-Dream Team האמריקאית בזהב אולימפי ב-1992?",["אטלנטה","סידני","ברצלונה","סיאול"],2],
["hist","איזו קבוצה זכתה באליפות ה-NBA ב-2023?",["דנבר נאגטס","מיאמי היט","בוסטון סלטיקס","גולדן סטייט"],0],
["hist","איזו קבוצה ניצחה בגמר ה-NBA של 2024?",["דאלאס מאבריקס","בוסטון סלטיקס","מינסוטה","אינדיאנה"],1],
["hist","איזו קבוצה חזרה מ-1:3 בגמר 2016 וניצחה את גולדן סטייט?",["קליבלנד קאבלירס","סן אנטוניו","אוקלהומה סיטי","יוסטון"],0],
["hist","איזו קבוצה סיימה את העונה הסדירה 2015-16 עם שיא של 73 ניצחונות?",["שיקגו בולס","גולדן סטייט ווריורס","לוס אנג'לס לייקרס","מיאמי היט"],1],

 guess(l){const s=this.s;if(!s||s.res||s.g.has(l))return;s.g.add(l);if(!s.w.includes(l))s.lives--;
  if([...s.w].every(x=>s.g.has(x))){s.res="win";s.streak++;s.xp+=8+s.lives*2;if(s.streak>=5)unlock("hang5");}
  else if(s.lives<=0)s.res="lose";

 nextWord(){this.s.i++;this.word();},
 end(){const s=this.s;const nb=setBest("hang",s.streak);finish(s.xp);
  $("#hangBox").innerHTML=resultHTML("🔤","סיכום תלייה",[`נחשתם ${s.streak} מילים ברצף${nb?" (שיא חדש! 🎉)":""}`,`+${s.xp} XP`],`<button class="btn" onclick="Hang.start()">שוב</button><button class="btn ghost" onclick="go('home')">לתפריט</button>`);}

const Shoot={
 modes:{

  half:{n:"🔴 חצי מגרש",shots:8,pts:4,pf:.02,gd:.045,sp:1.5,sx:90,d:"לאמיצים בלבד"}
 },
 s:null,on:false,raf:0,m:null,

 menu(){this.stop();$("#shootBox").innerHTML=`<div class="card center"><p class="lead">עצרו את המחוון באמצע (האזור הירוק) כדי לקלוע. לוחצים על הכפתור, על המגרש או על רווח.</p><div class="chips">${Object.entries(this.modes).map(([k,m])=>`<button class="btn" onclick="Shoot.start('${k}')">${m.n}<br><small>${m.d}</small></button>`).join("")}</div><p class="muted">שיאים: עונשין ${save.best.shoot_ft||0} · קשת ${save.best.shoot_three||0} · חצי מגרש ${save.best.shoot_half||0}</p></div>`;},
 start(k){this.stop();const m=this.m=this.modes[k];
  $("#shootBox").innerHTML=`<div class="card"><div class="stats"><span>זריקות: <b id="shl">${m.shots}</b></span><span>🎯 קליעות: <b id="shm">0</b></span><span>⭐ <b id="shs">0</b></span><span>🔥 <b id="shk">0</b></span></div>
  <canvas id="cv" width="640" height="360" onclick="Shoot.shoot()"></canvas>
  <div class="bar"><div class="z1" style="left:${50-m.gd*100}%;width:${m.gd*200}%"></div><div class="z2" style="left:${50-m.pf*100}%;width:${m.pf*200}%"></div><div id="mk"></div></div>
  <div class="msg" id="smsg"></div><div class="row"><button class="btn" id="shb" onclick="Shoot.shoot()">🏀 זרוק!</button></div></div>`;
  this.ctx=$("#cv").getContext("2d");
  this.s={k,left:m.shots,made:0,score:0,streak:0,perfects:0,pos:0,anim:null,over:false,ball:{x:m.sx,y:220}};
  this.on=true;this.raf=requestAnimationFrame(t=>this.loop(t));},
 loop(now){if(!this.on||!this.s)return;const s=this.s;
  if(!s.anim&&!s.over){const p=((now/1000)*this.m.sp)%2;s.pos=p<1?p:2-p;const mk=$("#mk");if(mk)mk.style.left=(s.pos*100)+"%";}
  if(s.anim){const a=s.anim;let t=now-a.t0;let done=true;
   for(const ph of a.ph){if(t<=ph.d){const u=t/ph.d;s.ball={x:ph.a.x+(ph.b.x-ph.a.x)*u,y:ph.t==="arc"?ph.a.y+(ph.b.y-ph.a.y)*u-ph.h*4*u*(1-u):ph.a.y+(ph.b.y-ph.a.y)*u*u};done=false;break;}t-=ph.d;}
   if(done){const last=a.ph[a.ph.length-1];s.ball={...last.b};s.anim=null;this.resolve(a.kind);}}
  this.draw();this.raf=requestAnimationFrame(t=>this.loop(t));},
 shoot(){const s=this.s;if(!s||s.anim||s.over||!this.on)return;const m=this.m,d=Math.abs(s.pos-.5);
  const kind=d<m.pf?"swish":d<m.gd?"make":d<m.gd*1.9?"rim":"air";const side=s.pos<.5?-1:1;
  const a={x:m.sx,y:220},H=90+Math.min(110,(540-m.sx)*.28),rin={x:527,y:166},ph=[];
  if(kind==="swish"||kind==="make"){ph.push({a,b:rin,d:900,t:"arc",h:H},{a:rin,b:{x:527,y:250},d:260,t:"fall"},{a:{x:527,y:250},b:{x:520,y:293},d:240,t:"fall"});}
  else if(kind==="rim"){const hit=side<0?{x:498,y:168}:{x:560,y:150};const out=side<0?{x:468,y:120}:{x:500,y:95};ph.push({a,b:hit,d:900,t:"arc",h:H},{a:hit,b:out,d:300,t:"arc",h:25},{a:out,b:{x:side<0?430:455,y:293},d:420,t:"fall"});}
  else if(side<0){ph.push({a,b:{x:470,y:225},d:900,t:"arc",h:H},{a:{x:470,y:225},b:{x:462,y:294},d:300,t:"fall"});}
  else{ph.push({a,b:{x:605,y:120},d:900,t:"arc",h:H+20},{a:{x:605,y:120},b:{x:618,y:294},d:420,t:"fall"});}
  s.anim={ph,t0:performance.now(),kind};$("#shb").disabled=true;},
 resolve(kind){const s=this.s,m=this.m;const made=kind==="swish"||kind==="make";s.left--;
  if(made){s.made++;s.score+=m.pts;s.streak++;if(kind==="swish")s.perfects++;}else s.streak=0;
  $("#shl").textContent=s.left;$("#shm").textContent=s.made;$("#shs").textContent=s.score;$("#shk").textContent=s.streak;
  const msgs={swish:"שווש! 🔥 מושלם",make:"בפנים! ✅",rim:"יצא מהטבעת! 😬",air:"איירבול! 🙈"};$("#smsg").textContent=msgs[kind]+(s.streak>=3?"  ·  רצף "+s.streak:"");
  if(s.left<=0){s.over=true;setTimeout(()=>{if(this.s===s)this.end();},1100);}
  else setTimeout(()=>{if(this.s!==s)return;s.ball={x:m.sx,y:220};const b=$("#shb");if(b)b.disabled=false;},350);},
 end(){const s=this.s,m=this.m;this.on=false;cancelAnimationFrame(this.raf);const xp=s.score*(s.k==="ft"?6:3)+s.perfects*2;const nb=setBest("shoot_"+s.k,s.score);
  if(s.k==="ft"&&s.made===10)unlock("swish");if(s.k==="three"&&s.score>=18)unlock("deep");finish(xp);
  $("#shootBox").innerHTML=resultHTML(s.made>=m.shots*.7?"🏆":"🏀","הסיבוב נגמר",[`קליעות: ${s.made} מתוך ${m.shots} (שווש מושלם: ${s.perfects})`,`ניקוד: ${s.score}${nb?" (שיא חדש! 🎉)":""}`,`+${xp} XP`],`<button class="btn" onclick="Shoot.start('${s.k}')">שוב</button><button class="btn ghost" onclick="Shoot.menu()">שינוי רמה</button>`);},
 draw(){const c=this.ctx,W=640,H=360,s=this.s;if(!c||!s)return;
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1d2a5a");g.addColorStop(1,"#0e1430");c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle="rgba(255,255,255,.05)";for(let i=0;i<14;i++){c.beginPath();c.arc(30+i*48,40+(i%3)*14,6,0,7);c.fill();}
  c.fillStyle="#b8793a";c.fillRect(0,300,W,60);c.fillStyle="#8a5a2b";c.fillRect(0,300,W,5);
  c.strokeStyle="rgba(255,255,255,.35)";c.lineWidth=3;c.beginPath();c.moveTo(380,300);c.lineTo(380,360);c.moveTo(250,300);c.lineTo(250,360);c.moveTo(90,300);c.lineTo(90,360);c.stroke();
  c.fillStyle="#666";c.fillRect(583,100,10,200);
  c.fillStyle="#f5f7ff";c.fillRect(566,78,8,128);c.strokeStyle="#ff7a1a";c.lineWidth=2;c.strokeRect(566,120,8,40);
  c.font="42px serif";c.textAlign="center";c.fillText("⛹️",this.m.sx-34,262);
  const b=s.ball;c.fillStyle="#ff7a1a";c.beginPath();c.arc(b.x,b.y,13,0,7);c.fill();c.strokeStyle="#5a2200";c.lineWidth=1.6;c.stroke();
  c.beginPath();c.moveTo(b.x-13,b.y);c.lineTo(b.x+13,b.y);c.moveTo(b.x,b.y-13);c.lineTo(b.x,b.y+13);c.stroke();
  c.beginPath();c.arc(b.x-14,b.y,11,-1,1);c.stroke();c.beginPath();c.arc(b.x+14,b.y,11,2.1,4.2);c.stroke();
  c.strokeStyle="rgba(255,255,255,.75)";c.lineWidth=1.4;c.beginPath();

};

const Draft={
 s:null,
 menu(){this.s=null;$("#draftBox").innerHTML=`<div class="card center"><p class="lead">בכל עמדה תקבלו 4 אגדות לבחירה. בנו חמישייה ונסו לנצח קבוצה היסטורית!</p><p class="muted">הדירוגים (1-99) הם דעה משעשעת שלנו, לא נתון רשמי. אפשר לא להסכים!</p><button class="btn" onclick="Draft.start()">מתחילים</button></div>`;},
 start(){this.s={i:0,team:[],opts:null};this.pickRound();},
 pickRound(){const s=this.s;s.opts=pick(POOL[POS[s.i][0]],4);this.draw();},
 draw(){const s=this.s;
  $("#draftBox").innerHTML=`<div class="card"><div class="stats"><span>עמדה ${s.i+1}/5</span><span>${s.team.map(p=>p[0].split(" ")[0]).join(" · ")||"הקבוצה ריקה"}</span></div><h3 class="center">בחרו ${POS[s.i][1]} (${POS[s.i][0]})</h3><div class="pl">${s.opts.map((p,k)=>`<button class="pc" onclick="Draft.choose(${k})"><b>${p[0]}</b><span class="rt">${p[1]}</span></button>`).join("")}</div></div>`;},
 choose(k){const s=this.s;s.team.push(s.opts[k]);s.i++;s.i<5?this.pickRound():this.summary();},
 avg(){return this.s.team.reduce((a,p)=>a+p[1],0)/5;},
 summary(){const s=this.s;s.opp=OPPS[ri(OPPS.length)];
  $("#draftBox").innerHTML=`<div class="card center pop"><h3>החמישייה שלכם</h3><table>${s.team.map((p,i)=>`<tr><td>${POS[i][1]}</td><td><b>${p[0]}</b></td><td><span class="rt">${p[1]}</span></td></tr>`).join("")}</table><p class="lead">דירוג ממוצע: <b>${this.avg().toFixed(1)}</b></p><p>היריבה: <b>${s.opp[0]}</b> (דירוג ${s.opp[1]})</p><div class="row"><button class="btn" onclick="Draft.play()">🏀 שחקו את המשחק!</button><button class="btn ghost" onclick="Draft.start()">בחירה מחדש</button></div></div>`;},
 split(t){const a=[0,0,0,0];let r=t;for(let i=0;i<3;i++){a[i]=Math.round(t/4+rnd(-4,4));r-=a[i];}a[3]=r;return a;},
 play(){const s=this.s;const sc=r=>Math.round(95+(r-90)*2.2+rnd(-9,9));let me=sc(this.avg()),op=sc(s.opp[1]);let ot="";
  if(me===op){const b=ri(2);me+=b?4:2;op+=b?2:4;ot=" (אחרי הארכה)";}
  const qm=this.split(me),qo=this.split(op),win=me>op;if(win)unlock("draft_win");const xp=win?40:15;finish(xp);
  $("#draftBox").innerHTML=`<div class="card center pop"><div class="big">${win?"🏆":"😤"}</div><h3>${win?"ניצחתם!":"הפסדתם הפעם"}${ot}</h3><table><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>סה״כ</th></tr><tr><td>אתם</td>${qm.map(x=>`<td>${x}</td>`).join("")}<td><b>${me}</b></td></tr><tr><td>${s.opp[0]}</td>${qo.map(x=>`<td>${x}</td>`).join("")}<td><b>${op}</b></td></tr></table><p>+${xp} XP</p><div class="row"><button class="btn" onclick="Draft.start()">חמישייה חדשה</button><button class="btn ghost" onclick="go('home')">לתפריט</button></div></div>`;}
};

const POSN={PG:"רכז",SG:"גארד קלע",SF:"פורוורד קטן",PF:"פורוורד כבד",C:"סנטר"};
const Stats={
 key:3,dir:-1,q:"",pos:"all",st:"all",cmp:[],
 cols:[["שחקן",0],["עמדה",1],["שנים",2],["נק׳",3],["ריב׳",4],["אס׳",5],["אליפויות",6],["MVP",7]],
 presets:[["🏀 הכי הרבה נקודות",3],["💪 ריבאונדים",4],["🎯 אסיסטים",5],["🏆 אליפויות",6],["⭐ תארי MVP",7]],
 render(){
  $("#statsBox").innerHTML=`<div class="card"><p class="lead">100 שחקנים גדולים בכל הזמנים: ממוצעי קריירה בעונה סדירה, אליפויות ותארי MVP. אפשר ללחוץ על כותרת כדי למיין, לחפש, לסנן ולהשוות בין שני שחקנים.</p>
  <p class="muted">⚠️ הרשימה היא בחירה שלנו ולא דירוג רשמי. המספרים מעוגלים ולא נבדקו מול מקור, אז לפני שמצטטים בעבודה כדאי לאמת באתר basketball-reference.com. אצל שחקנים פעילים (★) המספרים משתנים כל עונה, ולכן מופיע לפניהם ≈. אצל ג'וליוס ארווינג נספרים רק נתוני NBA. עמדות: PG רכז, SG גארד קלע, SF פורוורד קטן, PF פורוורד כבד, C סנטר.</p></div>
  <div class="card"><div class="ctl"><input class="in" id="stQ" placeholder="🔍 חיפוש שחקן..." oninput="Stats.q=this.value;Stats.table()">
  <select class="in" onchange="Stats.pos=this.value;Stats.table()"><option value="all">כל העמדות</option>${Object.entries(POSN).map(([k,v])=>`<option value="${k}">${k} · ${v}</option>`).join("")}</select>
  <select class="in" onchange="Stats.st=this.value;Stats.table()"><option value="all">פעילים ופורשים</option><option value="ret">פורשים בלבד</option><option value="act">פעילים בלבד</option></select></div>
  <div class="chips">${this.presets.map(p=>`<button class="btn ghost small" onclick="Stats.sort(${p[1]},-1)">${p[0]}</button>`).join("")}</div></div>
  <div id="stCmp"></div><div class="card"><div class="tw" id="stTable"></div></div>`;
  this.cmpDraw();this.table();},
 sort(k,d){if(d===undefined)d=this.key===k?-this.dir:(k<3?1:-1);this.key=k;this.dir=d;this.table();},
 rows(){const q=this.q.trim().toLowerCase();
  let r=STATS.map((p,i)=>({p,i})).filter(({p})=>(!q||p[0].toLowerCase().includes(q))&&(this.pos==="all"||p[1]===this.pos)&&(this.st==="all"||(this.st==="act"?p[8]:!p[8])));
  const k=this.key,d=this.dir;
  r.sort((a,b)=>{const x=a.p[k],y=b.p[k];const c=typeof x==="string"?x.localeCompare(y,"he"):x-y;return c*d||a.p[0].localeCompare(b.p[0],"he");});
  return r;},
 table(){const r=this.rows();
  $("#stTable").innerHTML=`<table class="st"><thead><tr>${this.cols.map(c=>`<th onclick="Stats.sort(${c[1]})">${c[0]}${c[1]===this.key?(this.dir<0?" ▼":" ▲"):""}</th>`).join("")}<th>השוואה</th></tr></thead><tbody>${
   r.map(({p,i})=>{const a=p[8]?"≈":"";return `<tr><td><b>${p[0]}</b>${p[8]?'<span class="tag">★ פעיל</span>':""}</td><td>${p[1]}</td><td>${p[2]}</td><td>${a}${p[3].toFixed(1)}</td><td>${a}${p[4].toFixed(1)}</td><td>${a}${p[5].toFixed(1)}</td><td>${p[6]}</td><td>${p[7]}</td><td><button class="cmpb ${this.cmp.includes(i)?"on":""}" onclick="Stats.pick(${i})">⚖️</button></td></tr>`;}).join("")||`<tr><td colspan="9">לא נמצאו שחקנים</td></tr>`}</tbody></table><p class="muted">מוצגים ${r.length} שחקנים מתוך ${STATS.length}</p>`;},
 pick(i){const c=this.cmp;const k=c.indexOf(i);if(k>=0)c.splice(k,1);else{c.push(i);if(c.length>2)c.shift();}this.cmpDraw();this.table();},
 cmpDraw(){const box=$("#stCmp");if(!box)return;const c=this.cmp;
  if(c.length<2){box.innerHTML=`<div class="card center"><p class="muted">⚖️ השוואה ראש בראש: לחצו על ⚖️ ליד שני שחקנים בטבלה${c.length?`<br>נבחר: <b>${STATS[c[0]][0]}</b>, בחרו עוד אחד`:""}</p></div>`;return;}
  const A=STATS[c[0]],B=STATS[c[1]];
  const rows=[["נק׳ למשחק",3,35,1],["ריבאונדים",4,25,1],["אסיסטים",5,12,1],["אליפויות",6,11,0],["תארי MVP",7,6,0]];
  box.innerHTML=`<div class="card pop"><div class="cnames"><span>${A[0]}</span><span>⚖️</span><span style="color:#4da3ff">${B[0]}</span></div>${rows.map(([l,k,mx,f])=>{
   const fa=(A[8]&&f?"≈":"")+(f?A[k].toFixed(1):A[k]),fb=(B[8]&&f?"≈":"")+(f?B[k].toFixed(1):B[k]);
   return `<div class="cr"><div><div class="cv ${A[k]>B[k]?"win":""}">${fa}</div><div class="cb"><i style="width:${Math.min(100,A[k]/mx*100)}%"></i></div></div><b>${l}</b><div><div class="cv ${B[k]>A[k]?"win":""}">${fb}</div><div class="cb b"><i style="width:${Math.min(100,B[k]/mx*100)}%"></i></div></div></div>`;}).join("")}
  <div class="row"><button class="btn ghost small" onclick="Stats.cmp=[];Stats.cmpDraw();Stats.table()">נקו השוואה</button></div></div>`;}
};

/* ============ חדשות NBA ============ */
const News={
 url:"https://raw.githubusercontent.com/nba-arena/nba-arena.github.io/main/news.json",
 esc(t){return String(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));},
 ago(iso){const m=Math.round((Date.now()-new Date(iso))/60000);if(isNaN(m))return"";if(m<60)return`לפני ${Math.max(m,1)} דקות`;const h=Math.round(m/60);if(h<24)return h===1?"לפני שעה":`לפני ${h} שעות`;const d=Math.round(h/24);return d===1?"אתמול":`לפני ${d} ימים`;},
 async load(){
  for(const u of [this.url+"?t="+Date.now(),"news.json?t="+Date.now()]){
   try{const r=await fetch(u,{cache:"no-store"});if(r.ok)return await r.json();}catch(e){}
  }
  return null;
 },
 PAGE:10,
 async render(){
  const box=$("#newsBox");
  box.innerHTML=`<div class="card center"><p class="lead">⏳ טוען חדשות...</p></div>`;
  const d=await this.load();
  if(!d||!d.items||!d.items.length){box.innerHTML=`<div class="card center"><p class="lead">📰 עוד אין כתבות.</p><p class="muted">הרובוט אוסף חדשות כל 3 שעות. נסו שוב מאוחר יותר!</p></div>`;return;}
  this.d=d;this.shown=this.PAGE;this.draw();
 },
 card(i){
  const safe=u=>/^https:\/\//.test(u||"")?u:"";
  return `<article class="nw">${safe(i.image)?`<img src="${this.esc(safe(i.image))}" alt="" loading="lazy" onerror="this.remove()">`:""}<div>
   <h3>${this.esc(i.title)}</h3>
   <div class="nwMeta">${this.esc(i.source)} · ${this.ago(i.date)}</div>
   ${i.summary?`<p>${this.esc(i.summary)}</p>`:""}
   ${safe(i.link)?`<a class="nwGo" href="${this.esc(safe(i.link))}" target="_blank" rel="noopener">👉 לכתבה המלאה ב-${this.esc(i.source)}</a>`:""}
  </div></article>`;
 },
 draw(){
  const items=this.d.items,n=Math.min(this.shown,items.length),left=items.length-n;
  $("#newsBox").innerHTML=`<p class="muted center">כותרות ותקצירים מאתרי הספורט, עם קישור לכתבה המלאה. עודכן ${this.ago(this.d.updated)}.</p>
  <div class="news">${items.slice(0,n).map(i=>this.card(i)).join("")}</div>
  <p class="muted center">מוצגות ${n} מתוך ${items.length} כתבות</p>
  ${left>0?`<div class="row"><button class="btn" onclick="News.more()">עוד כתבות ⬇️ (${Math.min(this.PAGE,left)})</button></div>`:""}`;
 },
 more(){this.shown+=this.PAGE;this.draw();}
};
